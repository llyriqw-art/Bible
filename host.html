<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bible Wheel • Host</title><link rel="stylesheet" href="style.css"></head><body><main><a href="index.html">← Home</a><h1>Host dashboard</h1><div id="status" class="notice">Connecting…</div><div class="card" id="start"><button id="create" class="primary">Create new room</button><button id="resume">Resume my room</button></div><div id="game" class="hide"><div class="card"><h2>Room <span id="code"></span></h2><div class="flex"><div><label>Contestant link</label><input id="playerUrl" readonly><button id="copyPlayer">Copy player link</button></div><div><label>Pixel display link</label><input id="displayUrl" readonly><button id="copyDisplay">Copy display link</button></div></div><div id="players" class="scores"></div></div><div class="split"><div class="card"><h2>Private answer & hint</h2><label>Choose puzzle</label><select id="puzzle"></select><button id="publish" class="primary">Publish selected puzzle</button><p><b>Answer:</b> <span id="answer">—</span></p><p><b>Scripture:</b> <span id="scripture">—</span></p><p><b>Hint to read:</b> <span id="hint">—</span></p><label>Edit selected puzzle's answer</label><input id="editAnswer"><label>Scripture reference</label><input id="editScripture"><label>Host hint</label><textarea id="editHint"></textarea><button id="saveEdit">Save edits on this device</button></div><div class="card"><h2>Game controls</h2><p>Current turn: <b id="turn">Player 1</b></p><button id="spin" class="primary">Spin wheel</button><button id="final">Start final round</button><div class="notice">Wheel: <b id="spinValue">—</b></div><div class="letters" id="letters"></div><p class="tiny muted">Choose consonants after spinning. Vowels cost $250 and do not need a spin.</p><label>Check a full solve</label><input id="solution" placeholder="Full phrase"><button id="solve">Check solve</button><button id="next">Pass turn</button><button id="finish">Finish game</button><div id="result" class="notice">Waiting for players</div></div></div></div></main><script type="module" src="host.js"></script></body></html>
